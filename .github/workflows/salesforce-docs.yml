# Salesforce Documentation Agent
#
# On every merge to main that touches Salesforce metadata in the sample project:
#   1. Detect changed metadata (git diff + sfdx-git-delta)
#   2. Ask Claude to fill the matching template for each changed component
#   3. Check the output (placeholders, secrets, record IDs, "Manual notes")
#   4. Open a PR from docs/auto-update to main for human review
#
# See docs/architecture.md for the full design.
# Required secret: ANTHROPIC_API_KEY

name: Salesforce Docs Agent

on:
  push:
    branches: [main]
    paths:
      - "sample-sfdx-project/force-app/**"
  workflow_dispatch:
    inputs:
      from_ref:
        description: "Compare from this ref (default: previous commit)"
        required: false
        default: ""
      dry_run:
        description: "Print generated docs instead of opening a PR"
        type: boolean
        default: false

# One run at a time; a newer merge replaces a queued run.
concurrency:
  group: salesforce-docs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  PROJECT_DIR: sample-sfdx-project
  SOURCE_DIR: sample-sfdx-project/force-app
  DOCS_DIR: docs
  MODEL: claude-sonnet-5-5
  MAX_FILE_BYTES: "60000"
  MAX_COMPONENTS: "25"

jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve commit range
        id: range
        run: |
          TO="${GITHUB_SHA}"
          if [ -n "${{ inputs.from_ref }}" ]; then
            FROM="${{ inputs.from_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            FROM="${{ github.event.before }}"
          else
            FROM="$(git rev-parse "${TO}~1")"
          fi
          echo "from=${FROM}" >> "$GITHUB_OUTPUT"
          echo "to=${TO}"     >> "$GITHUB_OUTPUT"
          echo "Comparing ${FROM}..${TO}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"   # current Salesforce CLI needs Node 22+

      - name: Install Salesforce CLI and sfdx-git-delta
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta
          sf --version

      - name: Detect changed metadata
        id: delta
        run: |
          mkdir -p .sgd
          sf sgd source delta \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --source-dir "${SOURCE_DIR}" \
            --output-dir .sgd \
            --api-version 62.0

          # Plain file list (added/modified/renamed/deleted) for the agent prompt.
          git diff --name-status \
            "${{ steps.range.outputs.from }}" "${{ steps.range.outputs.to }}" \
            -- "${SOURCE_DIR}" > .sgd/changed-files.txt

          echo "--- package.xml ---";            cat .sgd/package/package.xml
          echo "--- destructiveChanges.xml ---"; cat .sgd/destructiveChanges/destructiveChanges.xml
          echo "--- changed files ---";          cat .sgd/changed-files.txt

          COUNT=$(wc -l < .sgd/changed-files.txt | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT}" -gt "${MAX_COMPONENTS}" ]; then
            echo "::error::${COUNT} changed files exceeds MAX_COMPONENTS=${MAX_COMPONENTS}. Run manually with a narrower range."
            exit 1
          fi

      - name: Generate documentation with Claude
        if: steps.delta.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model ${{ env.MODEL }}
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git log:*),Bash(git show:*)"
          prompt: |
            You are the Salesforce documentation agent for this repository.
            Follow the rules in `docs/prompts/system-prompt.md` exactly.

            ## Changed metadata
            - Changed files (git name-status): `.sgd/changed-files.txt`
            - Added/modified components: `.sgd/package/package.xml`
            - Deleted components: `.sgd/destructiveChanges/destructiveChanges.xml`
            - Source root: `${{ env.SOURCE_DIR }}`

            ## For each added or modified component
            1. Classify it and pick the template from `docs/templates/`:
               | Source | Template | Output |
               |---|---|---|
               | `classes/*.cls` | `apex-class.md` | `docs/apex/<Name>.md` |
               | `triggers/*.trigger` | `apex-trigger.md` | `docs/triggers/<Name>.md` |
               | `lwc/<name>/*` | `lwc-component.md` | `docs/lwc/<name>.md` |
               | `objects/<Obj>/**` | `custom-object.md` | `docs/objects/<Obj>.md` |
               | `flows/*.flow-meta.xml` | `flow.md` | `docs/flows/<Name>.md` |
               Test classes (`*Test.cls`) are not documented on their own; refer to them
               from the class they test. Ignore files that match none of these.
            2. Read the source, its `-meta.xml`, and the objects, fields, and classes it
               references. If a file is larger than ${{ env.MAX_FILE_BYTES }} bytes, read only the
               first part and note the truncation in the doc.
            3. Use `git log -3 --format="%h %ad %s" --date=short -- <file>` for "Change history".
            4. Write the completed document to the output path. If the doc already exists,
               copy its "## Manual notes" section (to end of file) exactly, byte for byte.
            5. See `docs/sample-output/` for the expected style.

            ## For each deleted component
            Do not delete the doc. Add this line directly under the title:
            `> **Deprecated:** source removed in ${{ steps.range.outputs.to }}.`

            ## Index
            Regenerate `docs/index.md`: one table per component type listing every doc in
            `docs/apex`, `docs/triggers`, `docs/lwc`, `docs/objects`, and `docs/flows`
            with a link and a one-line summary, followed by a Mermaid diagram of object
            relationships taken from the object docs.

            ## Limits
            - Only write inside `docs/apex`, `docs/triggers`, `docs/lwc`, `docs/objects`,
              `docs/flows`, and `docs/index.md`. Never edit templates, prompts, or source.
            - Do not commit, push, or create branches. The workflow handles that.

      - name: Check generated docs
        if: steps.delta.outputs.count != '0'
        run: |
          set -euo pipefail
          CHANGED=$(git status --porcelain -uall -- "${DOCS_DIR}" | awk '{print $2}' | grep '\.md$' || true)
          if [ -z "${CHANGED}" ]; then
            echo "No documentation changes."
            exit 0
          fi
          echo "Changed docs:"; echo "${CHANGED}"
          FAIL=0

          for f in ${CHANGED}; do
            # Only generated folders may change.
            case "$f" in
              docs/apex/*|docs/triggers/*|docs/lwc/*|docs/objects/*|docs/flows/*|docs/index.md) ;;
              *) echo "::error file=$f::Agent wrote outside the allowed folders"; FAIL=1; continue ;;
            esac

            # Unfilled template placeholders.
            if grep -n '{{' "$f"; then
              echo "::error file=$f::Unfilled template placeholder"; FAIL=1
            fi

            # Secrets, org IDs, emails, org URLs.
            if grep -nE 'sk-ant-[A-Za-z0-9_-]+|00D[A-Za-z0-9]{12}([A-Za-z0-9]{3})?\b|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|[a-z0-9-]+\.(my\.)?salesforce\.com|-----BEGIN [A-Z ]*PRIVATE KEY-----' "$f"; then
              echo "::error file=$f::Possible secret, record ID, email, or org URL"; FAIL=1
            fi

            # "Manual notes" must be unchanged for existing docs.
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              OLD=$(git show "HEAD:$f" | sed -n '/^## Manual notes/,$p')
              NEW=$(sed -n '/^## Manual notes/,$p' "$f")
              if [ "$OLD" != "$NEW" ]; then
                echo "::error file=$f::Manual notes section was changed"; FAIL=1
              fi
            fi
          done

          exit "${FAIL}"

      - name: Print docs (dry run)
        if: steps.delta.outputs.count != '0' && inputs.dry_run
        run: |
          git status --porcelain -- "${DOCS_DIR}"
          git diff -- "${DOCS_DIR}"
          for f in $(git ls-files --others --exclude-standard -- "${DOCS_DIR}"); do
            echo "===== $f ====="; cat "$f"
          done

      - name: Open documentation pull request
        if: steps.delta.outputs.count != '0' && !inputs.dry_run
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/auto-update
          base: main
          add-paths: |
            docs/apex/**
            docs/triggers/**
            docs/lwc/**
            docs/objects/**
            docs/flows/**
            docs/index.md
          commit-message: "docs: update Salesforce component documentation"
          title: "docs: update Salesforce component documentation"
          labels: documentation, automated
          delete-branch: true
          body: |
            Automated documentation update for metadata changed in
            `${{ steps.range.outputs.from }}..${{ steps.range.outputs.to }}`.

            **Reviewer checklist**
            - [ ] Descriptions match what the code does
            - [ ] No secrets, record IDs, emails, or org URLs
            - [ ] "Manual notes" sections are unchanged

            Generated by `.github/workflows/salesforce-docs.yml` using `${{ env.MODEL }}`.
