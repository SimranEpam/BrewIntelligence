# Salesforce Documentation Agent
#
# On every push, and on every pull request (opened/updated), that touches
# Salesforce metadata in the sample project:
#   1. Detect changed metadata for the event's own range (git diff + sfdx-git-delta)
#   2. Map each changed component to its module (docs/modules.json) and update
#      one document per affected module, docs/modules/<module>.md, with
#      GitHub Copilot CLI (ci/generate-docs.mjs)
#   3. Check the output (placeholders, secrets, record IDs, "Manual notes")
#   4. Commit the generated docs back onto the branch that was pushed
#
# Both triggers are needed, and they do different jobs:
#   - `push` covers every commit to any branch, whether or not a pull request
#     is open. This is what keeps docs up to date when a component is changed
#     again later: an existing docs/modules/<module>.md is regenerated, not
#     just created the first time.
#   - `pull_request` covers `opened`/`reopened`, where a PR is raised against
#     commits that were already pushed, so no push event fires.
# The concurrency group is keyed on the branch, so when both fire for the same
# branch they do not race to commit docs.
#
# The agent commits with GITHUB_TOKEN, and GitHub does not start new workflow
# runs from GITHUB_TOKEN pushes, so the docs commit cannot re-trigger this
# workflow. The loop guard below is a second line of defence for the case
# where that commit reaches the branch some other way.
#
# Limitation: pull_request runs from a forked repository get a read-only
# GITHUB_TOKEN, so the push step will fail for fork PRs. That's fine for this
# repository's internal branches; cross-fork contributions would need a
# different token (e.g. a PAT) to push docs back.
#
# See docs/architecture.md for the full design.
# Setup: no secrets. The built-in GITHUB_TOKEN authenticates Copilot CLI, which
# needs the `copilot-requests: write` permission below and the organization
# policy "Allow use of Copilot CLI billed to the organization" (Copilot policies).
# Usage is billed to the organization. If that policy can't be enabled, create a
# fine-grained token with the "Copilot Requests" permission, store it as a secret,
# and pass it as COPILOT_GITHUB_TOKEN in the generation step instead.
# (GitHub Models was retired on 2026-07-30. To use another OpenAI-compatible API,
# set LLM_PROVIDER=api with LLM_ENDPOINT, LLM_API_KEY and MODEL.)

name: Salesforce Docs Agent

on:
  push:
    # Branches only. A tag push has no branch to commit docs back to.
    branches:
      - "**"
    paths:
      - "sample-sfdx-project/force-app/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "sample-sfdx-project/force-app/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print generated docs instead of committing them"
        type: boolean
        default: false

# Keyed on the branch, not the PR, so a push event and a pull_request event for
# the same branch share one group instead of both committing docs. A newer
# commit supersedes any in-flight run for that branch.
concurrency:
  group: salesforce-docs-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  copilot-requests: write   # lets GITHUB_TOKEN make Copilot CLI requests

env:
  PROJECT_DIR: sample-sfdx-project
  SOURCE_DIR: sample-sfdx-project/force-app
  DOCS_DIR: docs
  MAX_CONTEXT_CHARS: "30000"
  MAX_COMPONENTS: "25"
  DOCS_BOT_EMAIL: docs-agent@noreply.github.com

jobs:
  document:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Check out the commit being documented
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Skip if triggered by the docs agent's own commit
        id: guard
        run: |
          set -euo pipefail
          AUTHOR_EMAIL="$(git log -1 --format='%ae')"
          SUBJECT="$(git log -1 --format='%s')"

          # Match on the agent's own author identity, and on the exact subject
          # it writes. A bare "docs:*" prefix would also swallow a developer's
          # own commit (e.g. "docs: fix typo") that changes metadata, and that
          # change would then never be documented.
          if [ "${AUTHOR_EMAIL}" = "${DOCS_BOT_EMAIL}" ] \
             || [[ "${SUBJECT}" == "docs: update documentation for "* ]]; then
            echo "Head commit was made by the docs agent itself; skipping to avoid a trigger loop."
            echo "Skipped: head commit \`${SUBJECT}\` is the docs agent's own." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Documenting commit: ${SUBJECT} (${AUTHOR_EMAIL})"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve diff range
        id: range
        if: steps.guard.outputs.skip != 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          EMPTY_TREE="$(git hash-object -t tree /dev/null)"

          # Usable only if it is a real commit we actually have (a deleted
          # branch, a force-push or a brand-new branch gives us a zero SHA or
          # an unreachable one).
          have_commit() {
            case "$1" in ""|0000000000000000000000000000000000000000) return 1 ;; esac
            git cat-file -e "$1^{commit}" 2>/dev/null
          }

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            # Whole PR: base..head, so a module is documented from the full
            # change set even if an earlier run was cancelled or skipped.
            TO="${PR_HEAD_SHA}"
            FROM="${PR_BASE_SHA}"
          else
            TO="${GITHUB_SHA}"
            # Incremental: just what this push added. github.event.before spans
            # every commit in the push; TO~1 would miss all but the last.
            if have_commit "${PUSH_BEFORE_SHA}"; then
              FROM="${PUSH_BEFORE_SHA}"
            elif git rev-parse --verify --quiet "${TO}~1" > /dev/null; then
              FROM="$(git rev-parse "${TO}~1")"
            else
              FROM="${EMPTY_TREE}"
            fi
          fi

          # A base we cannot read (force-push, cross-fork, truncated history)
          # would fail the diff. Fall back to the merge base, then to TO~1.
          if ! have_commit "${FROM}"; then
            if git merge-base "${FROM}" "${TO}" > /dev/null 2>&1; then
              FROM="$(git merge-base "${FROM}" "${TO}")"
            elif git rev-parse --verify --quiet "${TO}~1" > /dev/null; then
              echo "::warning::Base ${FROM} is unavailable; comparing against ${TO}~1 instead."
              FROM="$(git rev-parse "${TO}~1")"
            else
              echo "::warning::Base ${FROM} is unavailable; treating every component as new."
              FROM="${EMPTY_TREE}"
            fi
          fi

          echo "from=${FROM}" >> "$GITHUB_OUTPUT"
          echo "to=${TO}"     >> "$GITHUB_OUTPUT"
          echo "Comparing ${FROM}..${TO} (event: ${EVENT_NAME})"

      - name: Set up Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"   # current Salesforce CLI needs Node 22+

      - name: Install Salesforce CLI and sfdx-git-delta
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm install --global @salesforce/cli
          echo y | sf plugins install sfdx-git-delta
          sf --version

      - name: Install Copilot CLI
        if: steps.guard.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Detect changed metadata
        id: delta
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p .sgd
          sf sgd source delta \
            --from "${{ steps.range.outputs.from }}" \
            --to "${{ steps.range.outputs.to }}" \
            --source-dir "${SOURCE_DIR}" \
            --output-dir .sgd \
            --api-version 62.0

          # Plain file list (added/modified/renamed/deleted) for the agent prompt.
          git diff --name-status \
            "${{ steps.range.outputs.from }}" "${{ steps.range.outputs.to }}" \
            -- "${SOURCE_DIR}" > .sgd/changed-files.txt

          echo "--- package.xml ---";            cat .sgd/package/package.xml
          echo "--- destructiveChanges.xml ---"; cat .sgd/destructiveChanges/destructiveChanges.xml
          echo "--- changed files ---";          cat .sgd/changed-files.txt

          COUNT=$(wc -l < .sgd/changed-files.txt | tr -d ' ')
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT}" = "0" ]; then
            echo "No Salesforce metadata changed in this range; nothing to document." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Changed metadata (${COUNT} file(s))"
              echo
              echo '```'
              cat .sgd/changed-files.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${COUNT}" -gt "${MAX_COMPONENTS}" ]; then
            echo "::error::${COUNT} changed files exceeds MAX_COMPONENTS=${MAX_COMPONENTS}. Run manually with a narrower range."
            exit 1
          fi

      - name: Generate documentation with Copilot CLI
        if: steps.guard.outputs.skip != 'true' && steps.delta.outputs.count != '0'
        env:
          LLM_PROVIDER: copilot
          GITHUB_TOKEN: ${{ github.token }}
          TO: ${{ steps.range.outputs.to }}
        run: node ci/generate-docs.mjs

      - name: Check generated docs
        if: steps.guard.outputs.skip != 'true' && steps.delta.outputs.count != '0'
        run: |
          set -euo pipefail
          CHANGED=$(git status --porcelain -uall -- "${DOCS_DIR}" | awk '{print $2}' | grep '\.md$' || true)
          if [ -z "${CHANGED}" ]; then
            echo "No documentation changes."
            exit 0
          fi
          echo "Changed docs:"; echo "${CHANGED}"
          FAIL=0

          for f in ${CHANGED}; do
            # Only generated folders may change.
            case "$f" in
              docs/modules/*|docs/index.md) ;;
              *) echo "::error file=$f::Agent wrote outside the allowed folders"; FAIL=1; continue ;;
            esac

            # Unfilled template placeholders.
            if grep -n '{{' "$f"; then
              echo "::error file=$f::Unfilled template placeholder"; FAIL=1
            fi

            # Secrets, org IDs, emails, org URLs.
            if grep -nE 'sk-ant-[A-Za-z0-9_-]+|00D[A-Za-z0-9]{12}([A-Za-z0-9]{3})?\b|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|[a-z0-9-]+\.(my\.)?salesforce\.com|-----BEGIN [A-Z ]*PRIVATE KEY-----' "$f"; then
              echo "::error file=$f::Possible secret, record ID, email, or org URL"; FAIL=1
            fi

            # "Manual notes" must be unchanged for existing docs.
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              OLD=$(git show "HEAD:$f" | sed -n '/^## Manual notes/,$p')
              NEW=$(sed -n '/^## Manual notes/,$p' "$f")
              if [ "$OLD" != "$NEW" ]; then
                echo "::error file=$f::Manual notes section was changed"; FAIL=1
              fi
            fi
          done

          exit "${FAIL}"

      - name: Print docs (dry run)
        if: steps.guard.outputs.skip != 'true' && steps.delta.outputs.count != '0' && inputs.dry_run
        run: |
          git status --porcelain -- "${DOCS_DIR}"
          git diff -- "${DOCS_DIR}"
          for f in $(git ls-files --others --exclude-standard -- "${DOCS_DIR}"); do
            echo "===== $f ====="; cat "$f"
          done

      - name: Commit documentation to the branch
        if: steps.guard.outputs.skip != 'true' && steps.delta.outputs.count != '0' && !inputs.dry_run && github.event_name != 'workflow_dispatch'
        env:
          # Branch to push docs back to: the PR's head branch, or the branch
          # that was pushed. Passed through env so an unusual branch name
          # cannot be interpolated into the script.
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "docs-agent"
          git config user.email "${DOCS_BOT_EMAIL}"

          for p in docs/modules docs/index.md; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done

          if git diff --cached --quiet; then
            echo "Nothing to commit: the regenerated docs match what is already on ${TARGET_REF}."
            echo "No documentation changes for \`${TARGET_REF}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ -n "${PR_NUMBER}" ]; then
            MSG="docs: update documentation for PR #${PR_NUMBER}"
          else
            MSG="docs: update documentation for ${GITHUB_SHA:0:7}"
          fi

          git commit -m "${MSG}"

          # Another commit may have landed while the agent was generating.
          # Rebase the docs commit onto it rather than failing the run.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_REF}"; then
              echo "Pushed docs to ${TARGET_REF}."
              {
                echo "### Documentation updated"
                echo
                git show --stat --oneline HEAD | sed '1d'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${TARGET_REF}."
            git fetch origin "${TARGET_REF}"
            if ! git rebase "origin/${TARGET_REF}"; then
              git rebase --abort || true
              echo "::error::Docs commit conflicts with ${TARGET_REF}. Re-run the workflow for the latest commit."
              exit 1
            fi
          done

          echo "::error::Could not push documentation to ${TARGET_REF} after 3 attempts."
          exit 1
